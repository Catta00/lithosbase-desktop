name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    env:
      MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
      MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # Il certificato Developer ID e' opzionale: senza, esce un .dmg non firmato.
      - name: Importa il certificato Developer ID
        if: env.MAC_CERT_P12 != ''
        run: |
          echo "$MAC_CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p runner build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p runner build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k runner build.keychain
          rm /tmp/cert.p12

      - name: Costruisci il .dmg
        run: |
          if [ -n "$MAC_CERT_P12" ] && [ -n "$APPLE_ID" ]; then
            echo "Build firmata e notarizzata"
            npx electron-builder --mac --universal --publish never --config.mac.notarize=true
          else
            echo "Build non firmata: nessun certificato configurato"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npx electron-builder --mac --universal --publish never --config.mac.identity=null
          fi

      # ────────────────────────────────────────────────────────────────────
      # LA VERIFICA, VISTO CHE UN MAC NON CE L'ABBIAMO.
      #
      # Questa macchina E' un Mac vero, quindi le domande che ci si farebbe
      # aprendo il file a mano si possono fare qui, ogni volta, da sole:
      # il disco si monta? dentro c'e' l'applicazione? gira su tutti e due i
      # processori? e soprattutto, il Mac di un cliente la aprirebbe?
      #
      # Il referto finisce nel riepilogo del run, cioe' in un riquadro in cima
      # alla pagina su github.com: si legge dal telefono senza scorrere i log.
      # ────────────────────────────────────────────────────────────────────
      - name: Verifica il pacchetto
        id: verifica
        run: |
          set -o pipefail
          DMG=$(find release -maxdepth 1 -name '*.dmg' | head -1)
          [ -n "$DMG" ] || { echo "Nessun .dmg costruito"; exit 1; }

          R() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          R "## Verifica del pacchetto Mac"
          R ""
          R "File: \`$(basename "$DMG")\`, $(du -h "$DMG" | cut -f1)"
          R ""

          # 1. il disco si monta, come quando lo apre il cliente
          PUNTO=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$PUNTO" >/dev/null
          APP=$(find "$PUNTO" -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            R "- Disco montato ma **dentro non c'e' nessuna applicazione**"
            hdiutil detach "$PUNTO" >/dev/null || true
            exit 1
          fi
          R "- Il disco si monta e dentro c'e' \`$(basename "$APP")\`"

          # 2. su quali processori gira
          BIN="$APP/Contents/MacOS/$(basename "$APP" .app)"
          ARCH=$(lipo -archs "$BIN" 2>/dev/null || echo sconosciuta)
          case "$ARCH" in
            *arm64*x86_64*|*x86_64*arm64*) R "- Gira sui Mac nuovi e su quelli Intel ($ARCH)" ;;
            *) R "- ⚠️ Gira solo su: $ARCH" ;;
          esac

          # 3. com'e' firmata
          FIRMA=$(codesign -dv --verbose=2 "$APP" 2>&1 || true)
          AUTORITA=$(echo "$FIRMA" | grep -m1 '^Authority=' | cut -d= -f2- || true)
          if echo "$FIRMA" | grep -q 'code object is not signed'; then
            R "- **Non firmata.** Il Mac del cliente non la aprira' al doppio clic."
            STATO=nonfirmata
          elif echo "$AUTORITA" | grep -q 'Developer ID'; then
            R "- Firmata con: $AUTORITA"
            STATO=firmata
          else
            R "- Firma provvisoria (ad-hoc), non riconosciuta da Apple: $AUTORITA"
            STATO=adhoc
          fi

          # 4. la domanda vera: il Mac di un cliente la farebbe partire?
          GATE=$(spctl -a -vvv -t install "$APP" 2>&1 || true)
          if echo "$GATE" | grep -q 'accepted'; then
            R "- **Gatekeeper la accetta**: si apre con un doppio clic, come qualsiasi programma."
          else
            R "- **Gatekeeper la rifiuta.** Chi la scarica vede un avviso e deve forzarla a mano."
            R ""
            R "  \`\`\`"
            R "  $(echo "$GATE" | head -3)"
            R "  \`\`\`"
          fi

          # 5. notarizzata? e' il timbro che toglie l'avviso anche al primo avvio
          if xcrun stapler validate "$APP" >/dev/null 2>&1; then
            R "- Notarizzata da Apple: nessun avviso nemmeno la prima volta."
          else
            R "- Non notarizzata."
          fi

          hdiutil detach "$PUNTO" >/dev/null || true

          R ""
          if [ "$STATO" = "firmata" ]; then
            R "**Esito: consegnabile.**"
          else
            R "**Esito: si costruisce ma non e' pronta per un cliente.** Mancano i segreti del certificato Developer ID."
          fi

      # L'artefatto serve a noi per provare: lo scarica solo chi ha accesso al
      # repository, ed e' loggato. Scade dopo novanta giorni.
      - uses: actions/upload-artifact@v4
        with:
          name: lithosbase-macos-dmg
          path: release/*.dmg
          if-no-files-found: error

      # La release invece e' pubblica, ed e' li' che il sito va a prendere il
      # file. Senza questo passo il .dmg esisteva ma non se lo poteva scaricare
      # nessun cliente, che e' come non averlo.
      #
      # Il file viene copiato con un nome fisso: il sito ci punta con un
      # indirizzo che non deve cambiare a ogni versione, e electron-builder nel
      # nome originale ci mette numero di versione e architettura.
      - name: Pubblica il .dmg nella release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG=$(find release -maxdepth 1 -name '*.dmg' | head -1)
          cp "$DMG" release/Lithosbase.dmg
          gh release create "${{ github.ref_name }}" --title "Lithosbase ${{ github.ref_name }}" --notes "" || true
          gh release upload "${{ github.ref_name }}" release/Lithosbase.dmg --clobber
